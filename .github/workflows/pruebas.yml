name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Pruebas rápidas con SQLite en memoria (no necesita servicios)
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Librerías de sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas automáticas
        run: pytest -q

  # Las mismas pruebas contra PostgreSQL 16, el motor de producción
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pruebas
          POSTGRES_USER: derma
          POSTGRES_PASSWORD: derma-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U derma -d pruebas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # psycopg2-binary es el controlador de requirements.txt
      DATABASE_URL: postgresql+psycopg2://derma:derma-ci@localhost:5432/pruebas
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Librerías de sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas automáticas (PostgreSQL)
        run: pytest -q
