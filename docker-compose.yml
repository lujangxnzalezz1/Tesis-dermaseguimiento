# Uso:  cp backend/.env.example backend/.env  (completar SECRET_KEY, PASARELA_WEBHOOK_SECRET, ADMIN_*)
#       docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dermaseguimiento
      POSTGRES_USER: derma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el entorno}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derma -d dermaseguimiento"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://derma:${POSTGRES_PASSWORD}@db:5432/dermaseguimiento
      RUTA_ALMACENAMIENTO: /data/almacenamiento
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - imagenes:/data/almacenamiento
volumes:
  pgdata:
  imagenes:
